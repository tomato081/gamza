<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자 (Gamza) - 따뜻한 동네 중고거래</title>
  <!-- Pretendard WebFont -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 통합 스타일시트 -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- ==========================================================
       [화면 1] 헤더 (Header)
       ========================================================== -->
  <header class="gamza-header">
    <div class="gamza-header-inner">
      <!-- 좌측 로고 -->
      <a href="./index.html" class="gamza-logo" aria-label="감자 홈으로 이동">
        <div class="gamza-logo-icon">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <path d="M16 4C9 4 5 9 5 17C5 25 10 29 17 29C24 29 28 24 28 16C28 8 23 4 16 4Z" fill="#B36B22"/>
            <path d="M14 6C9.5 6 7 9.5 7 16C7 22.5 11 26.5 16.5 26.5C22 26.5 25.5 22.5 25.5 15C25.5 8.5 20.5 6 14 6Z" fill="#D49047"/>
            <circle cx="12" cy="14" r="1.5" fill="#422509"/>
            <circle cx="19" cy="14" r="1.5" fill="#422509"/>
            <path d="M14 17C14.8 18.2 16.2 18.2 17 17" stroke="#422509" stroke-width="1.2" stroke-linecap="round"/>
            <ellipse cx="10" cy="16" rx="1.5" ry="0.8" fill="#FF8A8A" opacity="0.6"/>
            <ellipse cx="21" cy="16" rx="1.5" ry="0.8" fill="#FF8A8A" opacity="0.6"/>
            <path d="M16 4C16 1.8 14.5 1.5 13 2.5C14.2 3.8 15 4 16 4Z" fill="#5A9E32"/>
            <path d="M16 4C16.5 2 18 1.8 19 2.8C18 3.8 17.2 4 16 4Z" fill="#78B946"/>
          </svg>
        </div>
        <div class="gamza-logo-text">
          <span class="gamza-logo-title">감자</span>
          <span class="gamza-logo-subtitle">따뜻한 동네 중고거래</span>
        </div>
      </a>

      <!-- 중앙 검색창 -->
      <div class="gamza-search-box">
        <div class="gamza-search-wrapper">
          <input 
            type="text" 
            id="gamza-search-input" 
            class="gamza-search-input" 
            placeholder="근처의 중고 물품을 검색해보세요" 
            autocomplete="off"
          />
          <span class="gamza-search-btn" aria-label="검색 아이콘">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
        </div>
      </div>

      <!-- 우측 액션 버튼: [글쓰기], [로그인] / [닉네임, 로그아웃] -->
      <div class="gamza-header-actions">
        <button type="button" class="gamza-btn-primary" id="gamza-btn-write">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>글쓰기</span>
        </button>

        <!-- 로그인 전: [로그인] 버튼만 표시 -->
        <button type="button" class="gamza-btn-login" id="gamza-btn-login">
          <span>로그인</span>
        </button>

        <!-- 로그인 후: [닉네임]과 [로그아웃] 버튼만 표시 -->
        <div class="gamza-user-menu" id="gamza-user-menu" style="display:none;">
          <div class="gamza-user-pill" id="gamza-user-pill" title="내 감자 프로필">
            <span class="gamza-user-avatar-mini">🥔</span>
            <span class="gamza-user-nickname" id="gamza-user-nickname">닉네임</span>
          </div>
          <button type="button" class="gamza-btn-logout" id="gamza-btn-logout">
            <span>로그아웃</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==========================================================
       [화면 1] 서브 네비게이션 (카테고리 칩 바 & 필터 컨트롤)
       ========================================================== -->
  <nav class="gamza-subnav">
    <div class="gamza-subnav-inner">
      <!-- 카테고리 7개 버튼 -->
      <div class="gamza-category-list" role="tablist" aria-label="상품 카테고리 선택">
        <button type="button" class="category-chip active" data-category="전체">전체</button>
        <button type="button" class="category-chip" data-category="디지털기기">디지털기기</button>
        <button type="button" class="category-chip" data-category="가구/인테리어">가구/인테리어</button>
        <button type="button" class="category-chip" data-category="의류">의류</button>
        <button type="button" class="category-chip" data-category="생활가전">생활가전</button>
        <button type="button" class="category-chip" data-category="도서/티켓">도서/티켓</button>
        <button type="button" class="category-chip" data-category="기타">기타</button>
      </div>

      <!-- '거래 가능만 보기' 토글 및 결과 카운트 -->
      <div class="gamza-filter-bar">
        <div class="result-count-text">
          등록된 감자 물품 <strong id="gamza-result-count-num">6</strong>개
        </div>
        <label class="toggle-switch-label">
          <input type="checkbox" id="gamza-toggle-available" class="toggle-switch-input" />
          <span class="toggle-slider"></span>
          <span class="toggle-switch-text">거래 가능만 보기</span>
        </label>
      </div>
    </div>
  </nav>

  <!-- ==========================================================
       [화면 1] 메인 상품 목록 섹션
       ========================================================== -->
  <main class="gamza-main">
    <section id="gamza-product-grid" class="product-grid" aria-live="polite">
      <!-- 가짜 상품 6개 카드가 JS로 동적 렌더링됩니다 -->
    </section>
  </main>

  <!-- ==========================================================
       [화면 2] 상세 팝업 (모달)
       ========================================================== -->
  <div id="detailModalBackdrop" class="gamza-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="detailProductTitle">
    <div class="gamza-modal-window">
      <!-- 우상단 [✕] 닫기 버튼 -->
      <button type="button" id="detailModalCloseBtn" class="modal-close-btn" aria-label="상세 팝업 닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- 스크롤 가능한 본문 -->
      <div class="modal-scroll-body">
        <!-- 위쪽 절반: 상품 대표 이미지 -->
        <div class="detail-image-box">
          <img id="detailProductImage" class="detail-image" src="" alt="상품 대표 이미지" />
        </div>

        <!-- 아래쪽 내용 영역 (요구 순서 엄수) -->
        <div class="detail-content">
          <!-- 1) 판매 상태 배지 + 카테고리 태그 -->
          <div class="detail-tags-row">
            <span id="detailStatusBadge" class="status-badge status-sale">판매중</span>
            <span id="detailCategoryTag" class="detail-category-tag">카테고리</span>
          </div>

          <!-- [작성자 전용] 거래 상태 원클릭 변경 버튼 그룹 -->
          <div id="detailAuthorStatusSection" class="detail-author-status-section" style="display: none;">
            <span class="author-status-title">상태 변경:</span>
            <div class="author-status-buttons">
              <button type="button" class="btn-status-toggle" data-status="판매중">
                <span class="status-indicator indicator-sale"></span>판매중
              </button>
              <button type="button" class="btn-status-toggle" data-status="예약중">
                <span class="status-indicator indicator-reserved"></span>예약중
              </button>
              <button type="button" class="btn-status-toggle" data-status="거래 완료">
                <span class="status-indicator indicator-completed"></span>거래 완료
              </button>
            </div>
          </div>

          <!-- 2) 상품명 -->
          <h2 id="detailProductTitle" class="detail-title">상품 제목</h2>

          <!-- 3) 판매 위치 · 업로드 시간 -->
          <div class="detail-meta-row">
            <svg class="detail-meta-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span id="detailLocationText">판매 위치</span>
            <span>•</span>
            <span id="detailUploadTimeText">업로드 시간</span>
          </div>

          <!-- 4) 가격 -->
          <div id="detailPriceText" class="detail-price">0원</div>

          <!-- 5) 구분선 -->
          <hr class="detail-divider" />

          <!-- 6) 상품 설명 -->
          <div class="detail-desc-box">
            <h4 class="detail-desc-title">상품 상세 설명</h4>
            <p id="detailDescriptionText" class="detail-desc-text">상세 설명이 들어갑니다.</p>
          </div>

          <!-- 7) 판매자 정보 카드 (닉네임, 프로필 이미지, 판매 지역, 매너온도) -->
          <div class="detail-seller-card">
            <div class="seller-profile-left">
              <img id="detailSellerAvatar" class="seller-avatar-img" src="" alt="판매자 프로필" />
              <div>
                <div id="detailSellerNickname" class="seller-nickname">판매자 닉네임</div>
                <div id="detailSellerLocation" class="seller-location-text">판매 지역</div>
              </div>
            </div>
            <div class="seller-manner-right">
              <div class="manner-temp">
                <span>🥔</span>
                <span id="detailSellerManner">36.5°C</span>
              </div>
              <span class="manner-label">매너온도</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 8) 맨 아래 고정 액션 바 -->
      <!-- 8-1: 일반 구매자/방문자용 액션 바 [관심 추가], [채팅 시작하기] -->
      <div id="detailBuyerActionBar" class="detail-action-bar">
        <button type="button" id="detailWishBtn" class="btn-wish-toggle" aria-label="관심 상품 추가">
          <svg class="wish-icon" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="wish-label">관심 추가</span>
        </button>
        <button type="button" id="detailChatBtn" class="btn-chat-start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>채팅 시작하기</span>
        </button>
      </div>

      <!-- 8-2: 작성자 본인 전용 액션 바 [게시글 수정], [삭제] -->
      <div id="detailAuthorActionBar" class="detail-action-bar" style="display: none;">
        <button type="button" id="detailEditBtn" class="btn-author-action btn-author-edit">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>게시글 수정</span>
        </button>
        <button type="button" id="detailDeleteBtn" class="btn-author-action btn-author-delete">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>게시글 삭제</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================================
       [화면 3] 글쓰기 화면 (모달)
       ========================================================== -->
  <div id="writeModalBackdrop" class="gamza-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="writeModalHeading">
    <div class="gamza-modal-window write-modal-container">
      <!-- 모달 헤더 -->
      <div class="write-modal-header">
        <h3 id="writeModalHeading" class="write-modal-title">
          <span>🥔</span> 내 물품 등록하기 (글쓰기)
        </h3>
        <button type="button" id="writeModalCloseBtn" class="modal-close-btn" style="position:static;" aria-label="글쓰기 닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- 입력 폼 -->
      <form id="gamzaWriteForm" class="modal-scroll-body" style="display:flex; flex-direction:column;">
        <div class="write-form-body">
          <!-- 1. 상품 이미지 -->
          <div class="form-group">
            <label class="form-label">
              상품 이미지 <span class="required-mark">*</span>
            </label>
            <div class="image-upload-zone">
              <div class="image-preview-box">
                <img id="writeImagePreview" class="image-preview-img" alt="미리보기" />
                <div id="writeImagePlaceholder" class="image-preview-placeholder">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9C8E82" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                  <span>사진 미리보기</span>
                </div>
              </div>
              <div class="image-upload-controls">
                <label for="writeFileUpload" class="gamza-btn-secondary" style="font-size:13px; padding:7px 12px; cursor:pointer;">
                  📁 내 기기에서 사진 선택
                </label>
                <input type="file" id="writeFileUpload" accept="image/*" style="display:none;" />
                
                <div style="display:flex; gap:6px;">
                  <input type="url" id="writeImageUrlInput" class="form-input" style="padding:7px 10px; font-size:13px;" placeholder="또는 이미지 URL 직접 입력" />
                  <button type="button" id="btnApplyImageUrl" class="gamza-btn-secondary" style="padding:7px 12px; font-size:12.5px; flex-shrink:0;">
                    적용
                  </button>
                </div>

                <div style="margin-top:2px;">
                  <span style="font-size:11.5px; color:var(--text-muted); margin-bottom:4px; display:inline-block;">추천 샘플 이미지:</span>
                  <div id="sampleImageChips" class="sample-image-chips"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 2. 상품명 -->
          <div class="form-group">
            <label for="writeTitle" class="form-label">
              상품명 <span class="required-mark">*</span>
            </label>
            <input type="text" id="writeTitle" class="form-input" placeholder="상품명을 입력해주세요" required />
          </div>

          <!-- 3. 카테고리 -->
          <div class="form-group">
            <label for="writeCategory" class="form-label">
              카테고리 <span class="required-mark">*</span>
            </label>
            <select id="writeCategory" class="form-select" required>
              <option value="" disabled selected>카테고리를 선택하세요</option>
              <option value="디지털기기">디지털기기</option>
              <option value="가구/인테리어">가구/인테리어</option>
              <option value="의류">의류</option>
              <option value="생활가전">생활가전</option>
              <option value="도서/티켓">도서/티켓</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <!-- 4. 가격 -->
          <div class="form-group">
            <label for="writePrice" class="form-label">
              가격 (원) <span class="required-mark">*</span>
            </label>
            <input type="number" id="writePrice" class="form-input" placeholder="숫자만 입력 (무료 나눔은 0)" min="0" step="100" required />
          </div>

          <!-- 5. 거래 동네 -->
          <div class="form-group">
            <label for="writeLocation" class="form-label">
              거래 동네 <span class="required-mark">*</span>
            </label>
            <input type="text" id="writeLocation" class="form-input" placeholder="예: 서울 강남구 역삼동, 강원도 춘천시 효자동" required />
          </div>

          <!-- 6. 판매 상태 (판매중 / 예약중 / 거래 완료) -->
          <div class="form-group">
            <label class="form-label">
              판매 상태 <span class="required-mark">*</span>
            </label>
            <div class="status-radio-group">
              <label class="status-radio-label selected">
                <input type="radio" name="writeStatus" value="판매중" class="status-radio-input" checked />
                <span>🟢 판매중</span>
              </label>
              <label class="status-radio-label">
                <input type="radio" name="writeStatus" value="예약중" class="status-radio-input" />
                <span>🟠 예약중</span>
              </label>
              <label class="status-radio-label">
                <input type="radio" name="writeStatus" value="거래 완료" class="status-radio-input" />
                <span>⚪ 거래 완료</span>
              </label>
            </div>
          </div>

          <!-- 7. 자세한 설명 -->
          <div class="form-group">
            <label for="writeDescription" class="form-label">
              자세한 설명 <span class="required-mark">*</span>
            </label>
            <textarea id="writeDescription" class="form-textarea" placeholder="물품 상태(구매 시기, 사용감, 하자 여부 등)를 솔직하게 작성해주세요." required></textarea>
          </div>
        </div>

        <!-- 맨 아래 [작성 완료] 버튼 -->
        <div class="write-modal-footer">
          <button type="submit" class="gamza-btn-primary" style="width:100%; padding:12px; font-size:16px;">
            작성 완료
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================================
       [화면 4] 로그인 & 회원가입 모달 (수파베이스 Auth 연동)
       ========================================================== -->
  <div id="authModalBackdrop" class="gamza-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <div class="gamza-modal-window auth-modal-container">
      <!-- 닫기 버튼 [✕] -->
      <button type="button" id="authModalCloseBtn" class="modal-close-btn" aria-label="로그인 창 닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- 모달 상단 헤더 & 브랜드 타이틀 -->
      <div class="auth-modal-header">
        <div class="auth-modal-brand">
          <span class="auth-brand-icon">🥔</span>
          <h3 id="authModalTitle" class="auth-modal-title">따뜻한 감자마을 로그인</h3>
          <p class="auth-modal-desc" id="authModalDesc">동네 이웃과 따뜻한 중고거래를 시작해보세요!</p>
        </div>
        <!-- 탭 전환 버튼 [로그인] / [회원가입] -->
        <div class="auth-tab-group" role="tablist">
          <button type="button" class="auth-tab-btn active" id="authTabLogin" data-tab="login" role="tab">로그인</button>
          <button type="button" class="auth-tab-btn" id="authTabSignup" data-tab="signup" role="tab">회원가입</button>
        </div>
      </div>

      <!-- 상황별 알림 배너 (예: 글쓰기 시도 시 로그인 유도) -->
      <div id="authNoticeBanner" class="auth-notice-banner" style="display:none;"></div>

      <div class="auth-modal-body">
        <!-- 1) 로그인 폼 -->
        <form id="gamzaLoginForm" class="auth-form-card" autocomplete="on">
          <div class="form-group">
            <label for="loginEmail" class="form-label">이메일 계정 <span class="required-mark">*</span></label>
            <input type="email" id="loginEmail" class="form-input" placeholder="example@email.com" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="loginPassword" class="form-label">비밀번호 <span class="required-mark">*</span></label>
            <input type="password" id="loginPassword" class="form-input" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required />
          </div>
          <div id="loginErrorMessage" class="auth-error-box" style="display:none;"></div>
          <button type="submit" class="gamza-btn-primary auth-submit-btn" id="btnLoginSubmit">
            로그인
          </button>
          <div class="auth-switch-prompt">
            아직 감자 회원이 아니신가요? 
            <button type="button" class="auth-switch-link" id="linkToSignup">회원가입하기</button>
          </div>
        </form>

        <!-- 2) 회원가입 폼 -->
        <form id="gamzaSignupForm" class="auth-form-card" autocomplete="on" style="display:none;">
          <div class="form-group">
            <label for="signupEmail" class="form-label">이메일 계정 <span class="required-mark">*</span></label>
            <input type="email" id="signupEmail" class="form-input" placeholder="example@email.com" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="signupPassword" class="form-label">비밀번호 <span class="required-mark">*</span></label>
            <input type="password" id="signupPassword" class="form-input" placeholder="6자리 이상 입력해주세요" minlength="6" autocomplete="new-password" required />
          </div>
          <div class="form-group">
            <label for="signupNickname" class="form-label">닉네임 <span class="required-mark">*</span></label>
            <input type="text" id="signupNickname" class="form-input" placeholder="활동할 닉네임 (예: 포슬감자, 알감자)" maxlength="20" required />
          </div>
          <div class="form-group">
            <label for="signupLocation" class="form-label">활동 동네 (선택)</label>
            <input type="text" id="signupLocation" class="form-input" placeholder="예: 서울 강남구 역삼동, 효자동" />
          </div>
          <div id="signupErrorMessage" class="auth-error-box" style="display:none;"></div>
          <button type="submit" class="gamza-btn-primary auth-submit-btn" id="btnSignupSubmit">
            회원가입 완료
          </button>
          <div class="auth-switch-prompt">
            이미 감자 계정이 있으신가요? 
            <button type="button" class="auth-switch-link" id="linkToLogin">로그인하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 메시지 영역 -->
  <div id="gamza-toast" class="gamza-toast"></div>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 통합 자바스크립트 -->
  <script src="./app.js"></script>
</body>
</html>
