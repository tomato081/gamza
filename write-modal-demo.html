<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감자(Gamza) - 글쓰기 모달 데모</title>
  <link rel="stylesheet" href="write-modal.css">
  <style>
    /* 데모 전용 레이아웃 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
      background-color: #F8F5F0;
      color: #2D231A;
      line-height: 1.5;
      padding: 0 0 60px 0;
    }
    /* 헤더 */
    .demo-header {
      background: #FFFFFF;
      border-bottom: 1.5px solid #EADBC8;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(70, 40, 15, 0.05);
    }
    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #945214;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .btn-header-write {
      background: #945214;
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 8px rgba(148,82,20,0.25);
      transition: all 0.2s;
    }
    .btn-header-write:hover {
      background: #7B410D;
      transform: translateY(-1px);
    }
    /* 컨테이너 */
    .container {
      max-width: 1040px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .section-title-box {
      margin-bottom: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #2D231A;
    }
    .item-count {
      color: #945214;
      font-size: 1rem;
      font-weight: 600;
    }
    /* 상품 목록 그리드 */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: #FFFFFF;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #EADBC8;
      box-shadow: 0 4px 12px rgba(70, 40, 15, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(70, 40, 15, 0.12);
    }
    .card-thumb {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #EEDCCE;
    }
    .card-content {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #945214;
      background: #FAF6F0;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #2D231A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-location {
      font-size: 0.82rem;
      color: #79685B;
      margin-bottom: 8px;
    }
    .card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: #945214;
      margin-top: auto;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #A39080;
    }
    .new-badge {
      animation: pulse 1.5s infinite;
      color: #DC2626;
      font-weight: 700;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header class="demo-header">
    <div class="header-inner">
      <a href="#" class="logo">
        <span>🥔</span> 감자 마켓
      </a>
      <div class="header-actions">
        <button type="button" id="openWriteModalBtn" class="btn-header-write">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>글쓰기</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 상품 목록 컨테이너 -->
  <main class="container">
    <div class="section-title-box">
      <h1 class="section-title">오늘의 분양 감자들 🌱</h1>
      <span class="item-count">총 <span id="totalProductCount">0</span>개</span>
    </div>

    <div id="productsContainer" class="products-grid">
      <!-- 렌더링 영역 -->
    </div>
  </main>

  <!-- [화면 3] 글쓰기 모달 컴포넌트 삽입 -->
  <div id="writeModalContainer"></div>

  <!-- 스크립트 연결 -->
  <script src="write-modal.js"></script>
  <script>
    // 초기 더미 상품 데이터 (Gamza 표준 데이터 스키마)
    window.gamzaProducts = [
      {
        id: 'gamza_init_1',
        title: '강원도 춘천 햇수미감자 5kg 박스 (선물용)',
        category: '기타',
        price: 18000,
        formattedPrice: '18,000원',
        location: '춘천시 효자동',
        status: '판매중',
        imageUrl: 'https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=600&q=80',
        description: '올해 갓 수확한 싱싱하고 포슬포슬한 햇감자입니다. 직거래 원해요!',
        createdAgo: '10분 전',
        likes: 12,
        chats: 3
      },
      {
        id: 'gamza_init_2',
        title: 'M2 맥북 에어 13인치 미드나이트 (상태 S급 풀박스)',
        category: '디지털기기',
        price: 980000,
        formattedPrice: '980,000원',
        location: '역삼1동',
        status: '판매중',
        imageUrl: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80',
        description: '배터리 효율 99% 실내 거치용으로만 깨끗하게 사용했습니다.',
        createdAgo: '32분 전',
        likes: 24,
        chats: 7
      },
      {
        id: 'gamza_init_3',
        title: '원목 감성 디자인 인테리어 체어 (이사 정리 급처)',
        category: '가구/인테리어',
        price: 35000,
        formattedPrice: '35,000원',
        location: '서초2동',
        status: '판매중',
        imageUrl: 'https://images.unsplash.com/photo-1580481077195-c3f915f01908?auto=format&fit=crop&w=600&q=80',
        description: '방 인테리어에 딱 맞는 원목 의자입니다. 직접 가져가셔야 합니다.',
        createdAgo: '1시간 전',
        likes: 8,
        chats: 2
      }
    ];

    // 상품 목록 렌더링 함수
    function renderProductList() {
      const container = document.getElementById('productsContainer');
      const countEl = document.getElementById('totalProductCount');
      if (!container) return;

      countEl.textContent = window.gamzaProducts.length;

      container.innerHTML = window.gamzaProducts.map((item, idx) => `
        <article class="product-card" data-id="${item.id}">
          <img src="${item.imageUrl}" alt="${item.title}" class="card-thumb" onerror="this.src='https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=600&q=80'">
          <div class="card-content">
            <span class="card-badge">${item.category}</span>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-location">📍 ${item.location} • ${item.createdAgo || '방금 전'}</p>
            <div class="card-price">${item.formattedPrice}</div>
            <div class="card-footer">
              <span>상태: ${item.status}</span>
              <span>💬 ${item.chats || 0} • ❤️ ${item.likes || 0}</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    // 모달 HTML 동적 로드 후 초기화
    fetch('write-modal.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('writeModalContainer').innerHTML = html;

        // GamzaWriteModal 인스턴스 생성 & 바인딩
        const writeModal = new GamzaWriteModal({
          products: window.gamzaProducts,
          openTrigger: '#openWriteModalBtn',
          onProductAdded: (newProduct, updatedProducts) => {
            console.log('🥔 새 상품이 등록되었습니다:', newProduct);
            // 목록 즉시 재렌더링
            renderProductList();
          }
        });

        // 커스텀 이벤트 리스너 테스트
        document.addEventListener('gamza:product-created', (e) => {
          console.log('[Event 감지] gamza:product-created:', e.detail.product.title);
        });

        // 초기 목록 렌더링
        renderProductList();
      })
      .catch(err => {
        console.error('write-modal.html 로드 실패:', err);
      });
  </script>
</body>
</html>
