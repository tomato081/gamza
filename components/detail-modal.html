<!-- ==========================================================================
     감자(Gamza) [화면 2] 상품 상세 팝업 (모달) 마크업 템플릿
     ========================================================================== -->

<div id="gamza-detail-modal-overlay" class="gamza-modal-overlay hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-product-title">
  <div class="gamza-modal-window" role="document">
    
    <!-- 모바일 바텀시트 핸들바 -->
    <div class="modal-drag-handle" aria-hidden="true"></div>

    <!-- 우상단 [✕] 닫기 버튼 -->
    <button type="button" class="gamza-modal-close-btn" id="modal-close-btn" aria-label="닫기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- 스크롤 가능한 본문 영역 -->
    <div class="gamza-modal-body-scroll" id="modal-scroll-area">
      
      <!-- 위쪽 절반: 상품 대표 이미지 영역 -->
      <div class="modal-image-wrapper">
        <img id="modal-product-image" src="" alt="상품 대표 이미지" class="modal-product-img" />
      </div>

      <!-- 아래쪽 내용 영역 (순서 엄수) -->
      <div class="modal-content-details">
        
        <!-- 1) 판매 상태 배지 + 카테고리 태그 -->
        <div class="modal-tags-row">
          <span class="gamza-badge status-selling" id="modal-status-badge">판매중</span>
          <span class="gamza-category-tag" id="modal-category-tag">생활가전</span>
        </div>

        <!-- 2) 상품명 (크고 굵은 제목) -->
        <h2 class="modal-product-title" id="modal-product-title">상품 제목이 표시됩니다</h2>

        <!-- 3) 판매 위치 · 업로드 시간 (메타 정보) -->
        <div class="modal-meta-row">
          <span class="meta-location-item">
            <svg class="meta-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span id="modal-location-text">서울 강남구 역삼동</span>
          </span>
          <span class="meta-bullet">•</span>
          <span class="meta-time" id="modal-time-text">방금 전</span>
        </div>

        <!-- 4) 가격 (눈에 띄는 큰 글씨체, 원화 포맷) -->
        <div class="modal-price-area">
          <span class="modal-price-val" id="modal-price-val">0원</span>
          <span class="modal-negotiable-badge" id="modal-negotiable-badge">가격 제안 불가</span>
        </div>

        <!-- 5) 구분선 -->
        <hr class="modal-divider" />

        <!-- 6) 상품 설명 (상세 텍스트, 줄바꿈 유지) -->
        <div class="modal-description-wrapper">
          <h3 class="modal-desc-heading">상품 설명</h3>
          <p class="modal-description-text" id="modal-description-text">
            상품 설명 내용이 표시됩니다.
          </p>
        </div>

        <!-- 7) 판매자 정보 카드 -->
        <div class="modal-seller-card">
          <div class="seller-profile-left">
            <div class="seller-avatar-container">
              <img id="modal-seller-avatar" src="" alt="판매자 프로필" class="seller-avatar-img" />
            </div>
            <div class="seller-details">
              <div class="seller-nickname" id="modal-seller-nickname">닉네임</div>
              <div class="seller-sub-meta">
                <span id="modal-seller-location">역삼동</span>
                <span>•</span>
                <span class="seller-cert-tag">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                  <span id="modal-seller-certs">인증 12회</span>
                </span>
              </div>
            </div>
          </div>

          <div class="manner-indicator-right">
            <div class="manner-temp-box">
              <span class="manner-temp-icon">🥔</span>
              <span id="modal-seller-manner">36.5°C</span>
            </div>
            <span class="manner-label">매너온도</span>
          </div>
        </div>

      </div>
    </div>

    <!-- 8) 맨 하단 고정/액션 바 -->
    <div class="gamza-modal-action-bar">
      <!-- [관심 추가] 하트 아이콘 버튼 -->
      <button type="button" class="modal-wish-btn" id="modal-wish-btn" aria-label="관심 상품 추가" aria-pressed="false">
        <svg class="heart-icon" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="modal-wish-count" id="modal-wish-count">0</span>
      </button>

      <!-- 가격 요약 표시 (하단 액션바 보조) -->
      <div class="action-bar-price-info">
        <span class="action-bar-label">판매가</span>
        <span class="action-bar-price" id="modal-bottom-price">0원</span>
      </div>

      <!-- [채팅 시작하기] 주황/브라운 포인트 버튼 (자리만 유지) -->
      <button type="button" class="modal-chat-btn" id="modal-chat-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        채팅 시작하기
      </button>
    </div>

  </div>
</div>
